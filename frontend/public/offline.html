<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#06246f">
    <title>CampusHub — Hors connexion</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f7fc;color:#082b55;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(520px,100%);padding:42px;border:1px solid #d5e1ef;border-radius:28px;background:#fff;box-shadow:0 24px 60px rgba(6,36,111,.12);text-align:center}.logo{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 22px;border-radius:22px;background:#06246f}.logo img{width:64px}h1{margin:0 0 12px;font-size:clamp(28px,5vw,42px)}p{margin:0 auto 28px;max-width:390px;line-height:1.65;color:#5f7188}button{border:0;border-radius:14px;padding:14px 22px;background:#087f74;color:#fff;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><span class="logo"><img src="/favicon.svg" alt=""></span><h1>Vous êtes hors connexion</h1><p>CampusHub n’arrive pas à joindre Internet. Vérifiez votre connexion, puis réessayez. Les éléments déjà chargés restent disponibles dans l’application.</p><button type="button" onclick="location.reload()">Réessayer</button></main></body>
</html>
