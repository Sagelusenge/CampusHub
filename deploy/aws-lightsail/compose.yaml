services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: campushub
      MYSQL_USER: campushub
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../database:/docker-entrypoint-initdb.d:ro
      - ./mysql-client.cnf:/etc/mysql/conf.d/campushub-client.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: https://${CAMPUSHUB_DOMAIN}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: campushub
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      DB_NAME: campushub
      DB_CONNECTION_LIMIT: 10
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      REFRESH_TOKEN_DAYS: 30
      BCRYPT_ROUNDS: 12
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-CampusHub}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-10}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
      CAMPUSHUB_IA_URL: http://campushub-ia:5000
      CAMPUSHUB_IA_TOKEN: ${CAMPUSHUB_IA_TOKEN}
      CAMPUSHUB_IA_MODEL: campushub-ia-local-v1
      CAMPUSHUB_IA_TIMEOUT_MS: 8000
      CAMPUSHUB_WEB_ENABLED: ${CAMPUSHUB_WEB_ENABLED:-true}
      CAMPUSHUB_WEB_TIMEOUT_MS: ${CAMPUSHUB_WEB_TIMEOUT_MS:-3500}
      CAMPUSHUB_WEB_MAX_SOURCES: ${CAMPUSHUB_WEB_MAX_SOURCES:-2}
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
      campushub-ia:
        condition: service_healthy

  campushub-ia:
    build:
      context: "../../My Agent"
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      CAMPUSHUB_IA_TOKEN: ${CAMPUSHUB_IA_TOKEN}
      CAMPUSHUB_IA_KNOWLEDGE_PATH: /app/data/campushub_knowledge.txt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CAMPUSHUB_DOMAIN: ${CAMPUSHUB_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:
